blueprint:
  name: "SpaceXAI: show a local media link at a scheduled time"
  description: >
    Share an existing local image or video in a Home Assistant notification
    each day. SpaceXAI must be set up, and administrator access is required.
    This does not contact xAI or generate billable content.
    Anyone with the link can read the file for one hour if they can reach
    your Home Assistant. The file is not deleted when the link expires.
  domain: automation
  input:
    media:
      name: "Media"
      description: "An existing image or video in Home Assistant's local media."
      selector:
        media:
          accept:
            - "image/*"
            - "video/*"
    notification_time:
      name: "Notification time"
      description: "The time each day to show a fresh link."
      default: "18:00:00"
      selector:
        time:
triggers:
  - trigger: time
    at: !input notification_time
actions:
  - action: spacexai.publish_media
    data:
      media: !input media
    response_variable: published_media
  - action: persistent_notification.create
    data:
      title: "Local media"
      message: "[Open media]({{ published_media.url }})"
